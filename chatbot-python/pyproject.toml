[project]
name = "horus-ai-advisor"
version = "0.1.0"
description = "Horus AI Advisor: motor informativo y de recomendaciones de Horus Group SRL (FastAPI, independiente de Laravel)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Propietario - Horus Group SRL" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
# Pruebas y calidad. HTTPX lo necesita TestClient y servirá para futuras integraciones.
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.8",
]
# Búsqueda semántica opcional (solo CPU). Ver README, sección 10.
# Instalar torch desde el índice CPU de PyTorch para no descargar CUDA.
semantic = [
    "sentence-transformers>=3.3,<6.0",
    "numpy>=1.26,<3.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Las pruebas de integración semántica cargan un modelo local; se ejecutan con `-m semantic`.
addopts = "-ra -m \"not semantic\""
markers = [
    "semantic: requiere sentence-transformers y el modelo descargado en models/",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",   # assert es legítimo en pruebas
    "E501",   # el ancho lo controla `ruff format`; quedan cadenas largas legibles
    "SIM905", # la lista de palabras vacías se mantiene como texto legible
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S603"]
