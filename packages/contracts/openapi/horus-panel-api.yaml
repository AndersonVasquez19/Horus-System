      description: "Permiso: `pagos.ver`. Se sirve con su tipo real, sin caché y nunca desde una URL pública."
      parameters:
        - { name: transaccion, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Imagen JPEG, PNG o WebP" }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [academico]
      summary: "Adjunta o reemplaza la captura del comprobante de un pago por confirmar"
      description: "Permiso: `pagos.registrar`. Campo `imagen` (JPG, PNG o WebP, hasta 3 MB); se vuelve a codificar sin metadatos. Confirmar el pago exige haberla adjuntado."
      parameters:
        - { name: transaccion, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /academico/pagos/exportar:
    post:
      tags: [academico]
      summary: "Exporta pagos (sin datos de tarjeta; protegido contra inyección de fórmulas)"
      description: "Permiso: `pagos.exportar`."

      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { description: Archivo de descarga (no se conserva en el servidor) }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    tokenServicio: { type: apiKey, in: header, name: X-Horus-Web-Token }
  parameters:
    Csrf: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: false, description: 'Revisión (ETag) del recurso. El BFF la envía en el cuerpo como `_revision`; Laravel acepta ambas. Sin ella: 428; obsoleta: 412.', schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: 'UUID aleatorio por intención. El BFF lo envía como `_clave`. Misma clave y mismos datos: respuesta repetida; misma clave con otros datos: 409.', schema: { type: string, format: uuid } }
    Pagina: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PorPagina: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
  responses:
    Recurso:
      description: Recurso en `{ data }`; los recursos con revisión devuelven además la cabecera `ETag`
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } }
    Error:
      description: Error con código estable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Sesion:
      description: Sesión del panel
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [usuario, roles, permisos, paneles, csrf_token]
                properties:
                  usuario: { type: object, properties: { id: { type: integer }, nombre: { type: string }, email: { type: string } } }
                  roles: { type: array, items: { type: string } }
                  permisos: { type: array, items: { type: string } }
                  paneles: { type: object, properties: { academico: { type: boolean }, servicios: { type: boolean } } }
                  csrf_token: { type: string }
                  expira_en: { type: [integer, 'null'], description: Fin de la vida absoluta (epoch en segundos) }
    Listado:
      description: Página de resultados
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object } }
              meta:
                type: object
                properties:
                  pagina: { type: integer }
                  por_pagina: { type: integer }
                  total: { type: integer }
                  paginas: { type: integer }
                  orden: { type: string }
                  filtros: { type: object }
  schemas:
    ImagenPrincipalEntrada:
      type: object
      required: [imagen, _revision]
      properties:
        imagen: { type: string, format: binary, description: "Una sola imagen JPG, PNG o WebP de hasta 3 MB; el nombre del cliente se ignora" }
        imagen_principal_alt: { type: [string, 'null'], maxLength: 160 }
        _revision: { type: string }
    TarjetaEntrada:
      type: object
      required: [titulo, descripcion, _revision]
      properties:
        titulo: { type: string, maxLength: 120 }
        descripcion: { type: string, maxLength: 1000 }
        caracteristicas: { type: string, description: "Una característica por línea (máximo 12 de 200 caracteres)" }
        variante_imagen: { type: [string, 'null'], enum: [producto, escena, null] }
        imagen_alt: { type: [string, 'null'], maxLength: 160 }
        imagen: { type: string, format: binary, description: "Opcional; una sola imagen JPG, PNG o WebP de hasta 3 MB" }
        quitar_imagen: { type: boolean, description: "Solo al editar y sin `imagen` nueva" }
        activo: { type: boolean }
        orden: { type: integer, minimum: 0, maximum: 9999 }
        _revision: { type: string }
    SoloRevision:
      type: object
      properties: { _revision: { type: string, description: Equivale a If-Match } }
    CursoEntrada:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string, maxLength: 30 }
        nombre: { type: string, maxLength: 255 }
        descripcion: { type: [string, 'null'] }
        categoria: { type: string, enum: [tecnologia, educacion, salud, gestion, otros] }
        duracion_horas: { type: integer, minimum: 0, maximum: 2147483647 }
        precio: { type: number, minimum: 0, maximum: 99999999.99 }
        modalidad: { type: string, enum: [presencial, semipresencial, virtual, hibrido] }
        horario: { type: [string, 'null'] }
        cupos_maximos: { type: integer, minimum: 0, maximum: 2147483647, description: No puede ser menor que las matrículas vigentes }
        estado: { type: string, enum: [activo, inactivo, archivado] }
    FichaCursoEntrada:
      type: object
      required: [titulo, resumen, modalidad, vigente_desde, vigente_hasta, confirmacion_publica, _revision]
      properties:
        titulo: { type: string }
        resumen: { type: string }
        modalidad: { type: string, enum: [presencial, semipresencial, virtual, hibrido] }
        horario: { type: [string, 'null'] }
        inscripcion: { type: [string, 'null'] }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date }
        confirmacion_publica: { type: boolean, description: Debe ser verdadero }
        _revision: { type: string }
    EstudianteEntrada:
      type: object
      required: [dni, nombres, apellidos, estado]
      properties:
        dni: { type: string, description: Único }
        nombres: { type: string }
        apellidos: { type: string }
        email: { type: [string, 'null'], format: email }
        telefono: { type: [string, 'null'] }
        fecha_nacimiento: { type: [string, 'null'], format: date }
        direccion: { type: [string, 'null'] }
        estado: { type: string, enum: [activo, inactivo] }
    MatriculaEntrada:
      type: object
      required: [estudiante_id, curso_id]
      properties:
        estudiante_id: { type: integer }
        curso_id: { type: integer }
        fecha_matricula: { type: string, format: date }
        estado: { type: string, enum: [pendiente, pagada, anulada] }
        monto_pagado: { type: [number, 'null'], minimum: 0 }
        observaciones: { type: [string, 'null'] }
    ServicioEntrada:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        nombre: { type: string }
        categoria: { type: [string, 'null'] }
        estado: { type: string, enum: [activo, inactivo, archivado] }
        _revision: { type: string }
    EstadoServicio:
      type: object
      required: [estado, _revision]
      properties: { estado: { type: string, enum: [activo, inactivo, archivado] }, _revision: { type: string } }
    FichaServicioEntrada:
      type: object
      required: [titulo, resumen, descripcion, vigente_desde, vigente_hasta, _revision]
      properties:
        titulo: { type: string }
        resumen: { type: string }
        descripcion: { type: string }
        categoria: { type: [string, 'null'] }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date }
        titulo_tarjetas: { type: [string, 'null'] }
        imagen_principal_alt: { type: [string, 'null'] }
        _revision: { type: string }
    AutorizarFicha:
      type: object
      required: [confirmacion_publica, _revision]
      properties: { confirmacion_publica: { type: boolean }, _revision: { type: string } }
    CotizacionEntrada:
      type: object
      required: [contacto_nombre, necesidad_cliente]
      description: Exige correo o teléfono del solicitante
      properties:
        contacto_nombre: { type: string }
        necesidad_cliente: { type: string }
        contacto_email: { type: [string, 'null'], format: email }
        contacto_telefono: { type: [string, 'null'] }
        servicio_uuid: { type: [string, 'null'], format: uuid }
        _revision: { type: string }
        _clave: { type: string, format: uuid }
    EstadoCotizacion:
      type: object
      required: [estado, _revision]
      properties: { estado: { type: string, enum: [en_revision] }, _revision: { type: string } }
    ResponsableCotizacion:
      type: object
      required: [responsable_id, _revision]
      properties: { responsable_id: { type: [integer, 'null'] }, _revision: { type: string } }
    SeguimientoEntrada:
      type: object
      required: [nota, _revision, _clave]
      properties:
        nota: { type: string }
        proximo_seguimiento: { type: [string, 'null'], format: date }
        _revision: { type: string }
        _clave: { type: string, format: uuid }
    EdicionEntrada:
      type: object
      description: "Entidad existente `convocatorias` (en la UI, «Edición»). Campos nuevos de infraestructura: ver `InfraestructuraEdicion`."
      required: [curso_id, modalidad, fecha_inicio, fecha_fin, cupos_maximos]
      properties:
        curso_id: { type: integer, minimum: 1 }
        nombre: { type: [string, 'null'], maxLength: 160 }
        modalidad: { type: string, enum: [presencial, virtual], description: "Solo `presencial` y `virtual` para ediciones nuevas; `semipresencial` e `hibrido` se conservan en datos heredados" }
        periodo_academico_id: { type: [string, 'null'], format: uuid }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: string, format: date }
        cupos_maximos: { type: integer, minimum: 1, maximum: 32767 }
        _revision: { type: string }
    CambioEstadoEdicion:
      type: object
      required: [estado]
      properties: { estado: { type: string, enum: [abierta, en_curso, cerrada, cancelada] }, _revision: { type: string } }
    HorariosEdicion:
      type: object
      required: [horarios]
      properties:
        horarios:
          type: array
          items:
            type: object
            required: [dia_semana, hora_inicio, hora_fin]
            properties:
              dia_semana: { type: integer, minimum: 1, maximum: 7 }
              hora_inicio: { type: string, example: '18:00' }
              hora_fin: { type: string, example: '20:00' }
              lugar: { type: [string, 'null'], maxLength: 120, deprecated: true }
              docente: { type: [string, 'null'], maxLength: 120, deprecated: true }
        _revision: { type: string }
    NotaEntrada:
      type: object
      required: [matricula_id, evaluacion, nota]
      properties:
        matricula_id: { type: integer }
        evaluacion: { type: string, format: uuid }
        nota: { type: string, description: "decimal(5,2)" }
        motivo: { type: string, maxLength: 200, description: "Obligatorio al corregir una nota ya registrada" }
    EvaluacionEntrada:
      type: object
      required: [nombre, peso]
      properties:
        nombre: { type: string, maxLength: 120 }
        peso: { type: string, description: "decimal(5,2); la suma por edición no puede superar 100.00" }
        fecha: { type: [string, 'null'], format: date }
        orden: { type: integer, minimum: 1 }
    DocenteEntrada:
      type: object
      description: "Docente identificado solo por DNI peruano. El DNI solo se envía al crear (no cambia después); `estado` solo al editar."
      required: [nombres, apellidos]
      properties:
        dni: { type: string, pattern: '^[0-9]{8}$', description: "Exactamente 8 dígitos, como texto; solo al crear. No puede coincidir con el de un estudiante." }
        nombres: { type: string, maxLength: 100 }
        apellidos: { type: string, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 150 }
        telefono: { type: [string, 'null'], maxLength: 20 }
        especialidad: { type: [string, 'null'], maxLength: 150 }
        estado: { type: string, enum: [activo, inactivo], description: "Solo al editar" }
    SedeEntrada:
      type: object
      required: [codigo, nombre, direccion]
      properties: { codigo: { type: string, maxLength: 20 }, nombre: { type: string, maxLength: 120 }, direccion: { type: string, maxLength: 200 }, ciudad: { type: string, maxLength: 80 } }
    AulaEntrada:
      type: object
      required: [sede, codigo, nombre, capacidad]
      properties: { sede: { type: string, format: uuid }, codigo: { type: string, maxLength: 20 }, nombre: { type: string, maxLength: 120 }, capacidad: { type: integer, minimum: 1, maximum: 32767 } }
    PlataformaEntrada:
      type: object
      required: [nombre, tipo]
      description: "Cataloga la herramienta externa (Meet, Zoom…). No guarda credenciales ni claves de API."
      properties: { nombre: { type: string, maxLength: 80 }, tipo: { type: string, enum: [meet, zoom, teams, otra] } }
    PeriodoEntrada:
      type: object
      required: [codigo, nombre, fecha_inicio, fecha_fin]
      properties: { codigo: { type: string, maxLength: 20 }, nombre: { type: string, maxLength: 100 }, fecha_inicio: { type: string, format: date }, fecha_fin: { type: string, format: date }, _revision: { type: string } }
    CambioEstadoSimple:
      type: object
      required: [estado]
      properties: { estado: { type: string, enum: [activo, inactivo] } }
    InfraestructuraEdicion:
      type: object
      description: "Presencial: `sede` y `aula` (del mismo campus) y sin plataforma. Virtual: `plataforma_virtual` y sin sede ni aula."
      properties: { sede: { type: [string, 'null'], format: uuid }, aula: { type: [string, 'null'], format: uuid }, plataforma_virtual: { type: [string, 'null'], format: uuid }, _revision: { type: string } }
    DocentesEdicion:
      type: object
      required: [docentes]
      properties:
        docentes: { type: array, items: { type: object, required: [docente, rol], properties: { docente: { type: string, format: uuid }, rol: { type: string, enum: [principal, apoyo] } } } }
        _revision: { type: string }
    SesionEntrada:
      type: object
      required: [fecha, hora_inicio, hora_fin]
      properties:
        numero: { type: [integer, 'null'], minimum: 1, description: "Opcional: si se omite, se asigna el siguiente de la edición" }
        fecha: { type: string, format: date }
        hora_inicio: { type: string, example: '18:00' }
        hora_fin: { type: string, example: '20:00' }
        tema: { type: [string, 'null'], maxLength: 200 }
        docente: { type: [string, 'null'], format: uuid }
        aula: { type: [string, 'null'], format: uuid }
        plataforma_virtual: { type: [string, 'null'], format: uuid }
        enlace_virtual: { type: [string, 'null'], format: uri, writeOnly: true, description: "Solo escritura; se guarda cifrado y no vuelve en ninguna respuesta salvo `GET …/enlace`" }
        _revision: { type: string }
    CancelarSesion:
      type: object
      required: [motivo]
      properties: { motivo: { type: string, maxLength: 200 }, _revision: { type: string } }
    AsistenciaLote:
      type: object
      required: [asistencias]
      properties:
        asistencias:
          type: array
          items: { type: object, required: [matricula_id, estado], properties: { matricula_id: { type: integer }, estado: { type: string, enum: [presente, ausente, tardanza, justificada] }, observacion: { type: [string, 'null'], maxLength: 200 } } }
    AsistenciaCorreccion:
      type: object
      required: [estado, motivo]
      properties: { estado: { type: string, enum: [presente, ausente, tardanza, justificada] }, motivo: { type: string, maxLength: 200 } }
    ObligacionEntrada:
      type: object
      required: [concepto, plan, monto_total]
      properties:
        concepto: { type: string, maxLength: 120 }
        plan: { type: string, enum: [completo, fraccionado] }
        monto_total: { type: string, description: "decimal(12,2), moneda PEN" }
        cuotas: { type: array, description: "Obligatorio si `plan = fraccionado`; la suma debe igualar `monto_total`", items: { type: object, required: [monto, vence], properties: { monto: { type: string }, vence: { type: string, format: date } } } }
    PagoEntrada:
      type: object
      required: [metodo, monto, fecha_pago]
      properties:
        metodo: { type: string, description: "Código del método de pago activo" }
        monto: { type: string, description: "decimal(12,2); no puede exceder el saldo" }
        fecha_pago: { type: string, format: date }
        referencia: { type: [string, 'null'], maxLength: 80 }
        confirmar: { type: boolean, description: "Registra y confirma en un paso; exige `pagos.confirmar` (dos eventos de auditoría)" }
    MotivoEntrada:
      type: object
      required: [motivo]
      properties: { motivo: { type: string, minLength: 10, maxLength: 200 } }
    ConsultaDniEntrada:
      type: object
      required: [dni]
      properties: { dni: { type: string, pattern: '^[0-9]{8}$', description: "Exactamente 8 dígitos (DNI peruano), como texto" } }
    ConsultaDniRespuesta:
      type: object
      properties:
        data:
          type: object
          required: [dni, nombres, apellido_paterno, apellido_materno, apellidos]
          properties:
            dni: { type: string }
            nombres: { type: string }
            apellido_paterno: { type: string }
            apellido_materno: { type: string, description: "Puede ser vacío" }
            apellidos: { type: string }
            ya_registrado_como_estudiante: { type: boolean }
            ya_registrado_como_docente: { type: boolean }
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
