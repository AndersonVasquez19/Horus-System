openapi: 3.1.0
info:
  title: Horus Group - API de los paneles administrativos (/api/panel/v1)
  version: 1.1.0
  description: |
    Contrato verificado contra `apps/api/routes/panel.php` y `app/Http/Controllers/Api/Panel/**` (12/11/2026).

    Solo la consume el BFF de `apps/web` (servidor a servidor). Toda petición lleva `X-Horus-Web-Token`; sin token
    configurado en Laravel las rutas responden 404, y con token incorrecto 401 `servicio_no_autorizado`.
    El BFF reenvía la cookie de sesión web de Laravel y, en mutaciones, `X-CSRF-TOKEN` (de `auth/csrf` o
    `auth/sesion`). `X-Horus-Client-Ip` lleva la IP del visitante para los limitadores.

    Errores: `{ message, code, errors? }` con `code` estable (`no_autenticado`, `sesion_expirada`, `prohibido`,
    `no_encontrado`, `csrf`, `validacion`, `demasiadas_solicitudes`, `error_interno`…).

    Seguridad por capas: token de servicio (`X-Horus-Web-Token`), sesión web, CSRF, `SesionPanelVigente`,
    permiso de entrada al panel (`panel.academico.acceder` / `panel.servicios.acceder`) y permiso por acción (se indica
    en cada operación). Las cotizaciones son además solo del rol `admin`.

    Concurrencia: las escrituras sobre servicios, fichas y cotizaciones exigen la revisión (`If-Match`; el BFF la envía
    como `_revision`) y responden 428 si falta y 412 si está obsoleta. Las creaciones y seguimientos de cotizaciones
    son idempotentes con `Idempotency-Key` (el BFF envía `_clave`). Mensajes de validación en español.

    Limitadores: `login`, `password-recovery`, `admin-write` (120/min), `admin-opciones` (120/min) y `admin-export` (6/min).

    Listados: `page`, `per_page` (1..100, 20 por defecto), `sort=campo|-campo` (lista blanca; un valor desconocido
    usa el orden por defecto) y filtros con nombre propio. Respuesta `{ data, meta }`.
servers:
  - url: http://127.0.0.1:8000/api/panel/v1
    description: Laravel local (solo para el BFF; no se expone al navegador)
security:
  - tokenServicio: []
tags:
  - name: auth
  - name: academico
  - name: servicios
paths:
  /auth/csrf:
    get:
      tags: [auth]
      summary: Abre o retoma una sesión anónima y devuelve su token CSRF
      responses:
        '200':
          description: Token CSRF de la sesión
          content:
            application/json:
              schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } }
  /auth/login:
    post:
      tags: [auth]
      summary: Inicia sesión (throttle `login`, por IP del visitante y por correo)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string, format: email, maxLength: 255 }, password: { type: string, maxLength: 1024 } }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '419': { $ref: '#/components/responses/Error' }
        '422':
          description: Credenciales inválidas o cuenta sin permiso de entrada (misma respuesta)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/Error' }
  /auth/sesion:
    get:
      tags: [auth]
      summary: Sesión actual con permisos (sin caché)
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Cierra la sesión y revoca los JWT de la cuenta
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
  /auth/contrasena/solicitar:
    post:
      tags: [auth]
      summary: Envía el enlace de recuperación (respuesta idéntica exista o no la cuenta)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Solicitud recibida }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/contrasena/restablecer:
    post:
      tags: [auth]
      summary: Restablece la contraseña con el token del correo; revoca JWT y sesiones
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 72 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Contraseña actualizada }
        '422': { $ref: '#/components/responses/Error' }
  /academico/resumen:
    get:
      tags: [academico]
      summary: "Dashboard académico (bloques según permisos de módulo; ingresos solo rol admin)"
      description: "Permiso: `panel.academico.acceder`."
      responses:
        '200': { description: Indicadores y bloques, content: { application/json: { schema: { type: object } } } }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/cursos:
    get:
      tags: [academico]
      summary: "Listado de cursos"
      description: "Permiso: `cursos.ver`."
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/PorPagina' }
        - { name: sort, in: query, schema: { type: string, enum: [nombre, -nombre, codigo, -codigo, cupos_disponibles, -cupos_disponibles, creado, -creado] } }
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: estado, in: query, schema: { type: string, enum: [activo, inactivo, archivado] } }
        - { name: modalidad, in: query, schema: { type: string, enum: [presencial, semipresencial, virtual, hibrido] } }
        - { name: categoria, in: query, schema: { type: string, enum: [tecnologia, educacion, salud, gestion, otros] } }
        - { name: eliminados, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Listado' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [academico]
      summary: "Crea un curso"
      description: "Permiso: `cursos.crear`."
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursoEntrada' }
      responses:
        '201': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/cursos/{curso}:
    get:
      tags: [academico]
      summary: "Detalle del curso con estudiantes minimizados"
      description: "Permiso: `cursos.ver`."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [academico]
      summary: "Edita un curso (no se pueden bajar los cupos por debajo de las matrículas vigentes)"
      description: "Permiso: `cursos.editar`."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursoEntrada' }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [academico]
      summary: "Archiva (eliminación lógica) un curso"
      description: "Permiso: `cursos.eliminar`."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { description: Curso archivado }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "Conflicto con una regla de negocio (cupo agotado, duplicado, ficha publicada, estado no permitido)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/cursos/{curso}/restaurar:
    post:
      tags: [academico]
      summary: "Restaura un curso archivado"
      description: "Permiso: `cursos.restaurar`."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "Conflicto con una regla de negocio (cupo agotado, duplicado, ficha publicada, estado no permitido)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/cursos/{curso}/publicacion:
    get:
      tags: [academico]
      summary: "Ficha pública del curso y su revisión (cabecera `ETag`)"
      description: "Permiso: `cursos.publicar`. La publicación es una autorización editorial distinta de activar el curso."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [academico]
      summary: "Guarda y autoriza la ficha pública (obliga a `confirmacion_publica`)"
      description: "Permiso: `cursos.publicar`. La revisión es obligatoria: `If-Match` o el campo `_revision` (el BFF reenvía solo el campo)."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FichaCursoEntrada' }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: "La revisión enviada ya no es la vigente (`If-Match` / `_revision` obsoleta); releer el recurso", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '428': { description: "Falta la precondición `If-Match` / `_revision` (`precondicion_requerida`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "Conflicto con una regla de negocio (cupo agotado, duplicado, ficha publicada, estado no permitido)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/cursos/{curso}/publicacion/retirar:
    post:
      tags: [academico]
      summary: "Retira la ficha pública"
      description: "Permiso: `cursos.publicar`."
      parameters:
        - { name: curso, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoloRevision' }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '412': { description: "La revisión enviada ya no es la vigente (`If-Match` / `_revision` obsoleta); releer el recurso", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '428': { description: "Falta la precondición `If-Match` / `_revision` (`precondicion_requerida`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/estudiantes:
    get:
      tags: [academico]
      summary: "Listado de estudiantes"
      description: "Permiso: `estudiantes.ver`."
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/PorPagina' }
        - { name: sort, in: query, schema: { type: string, enum: [apellidos, -apellidos, nombres, -nombres, dni, -dni, creado, -creado] } }
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 } }
        - { name: estado, in: query, schema: { type: string, enum: [activo, inactivo] } }
        - { name: eliminados, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Listado' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [academico]
      summary: "Registra un estudiante (DNI único)"
      description: "Permiso: `estudiantes.crear`."
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteEntrada' }
      responses:
        '201': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /academico/estudiantes/{estudiante}:
    get:
      tags: [academico]
      summary: "Ficha del estudiante con matrículas e historial minimizado (acción, fecha, usuario y campos; nunca valores ni IP)"
      description: "Permiso: `estudiantes.ver`."
      parameters:
        - { name: estudiante, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [academico]
      summary: "Edita un estudiante"
      description: "Permiso: `estudiantes.editar`."
      parameters:
        - { name: estudiante, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteEntrada' }
      responses:
        '200': { $ref: '#/components/responses/Recurso' }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "Sin el permiso exigido por la acción (`prohibido`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "El recurso no existe o fue eliminado", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: "Datos inválidos (`validacion`): mensajes de campo en español en `errors`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Demasiadas solicitudes (`demasiadas_solicitudes`); respeta `Retry-After`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [academico]
      summary: "Archiva (eliminación lógica) un estudiante"
      description: "Permiso: `estudiantes.eliminar`."
      parameters:
        - { name: estudiante, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { description: Estudiante archivado }
        '401': { description: "No autenticado (`no_autenticado`) o sesión caducada (`sesion_expirada`)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
