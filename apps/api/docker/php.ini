; Ajustes de producción para la imagen de Railway (se cargan después de los de la imagen base).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
; Imágenes de cursos y anexos del panel; Laravel valida el tamaño real en cada FormRequest.
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 60
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código no cambia dentro de un contenedor: cada despliegue crea uno nuevo.
opcache.validate_timestamps = 0
